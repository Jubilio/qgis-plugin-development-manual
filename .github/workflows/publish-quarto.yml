name: Publish Quarto book

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate Quarto chapters
        run: python scripts/prepare_quarto.py

      - name: Render HTML book
        run: quarto render --to html

      - name: Validate rendered book
        shell: bash
        run: |
          set -euo pipefail
          test -s _book/index.html
          test -s _book/search.json
          grep -q 'Jubílio Filiano Maússe' _book/index.html
          if grep -R 'Jubílio Filiano Mausse' _book --include='*.html'; then
            echo "The rendered book contains the unaccented family name"
            exit 1
          fi
          touch _book/.nojekyll

      - name: Upload rendered book
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quarto-book-html
          path: _book/
          if-no-files-found: error

      - name: Publish to gh-pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish Quarto book from ${{ github.sha }}"
