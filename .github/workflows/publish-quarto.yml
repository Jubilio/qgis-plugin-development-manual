name: Publish Quarto book

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate Quarto chapters
        run: python scripts/prepare_quarto.py

      - name: Render HTML book
        run: quarto render --to html

      - name: Validate rendered book
        shell: bash
        run: |
          set -euo pipefail
          test -s _book/index.html
          test -s _book/search.json
          grep -q 'Jubílio Filiano Maússe' _book/index.html
          if grep -R 'Jubílio Filiano Mausse' _book --include='*.html'; then
            echo "The rendered book contains the unaccented family name"
            exit 1
          fi
          touch _book/.nojekyll

      - name: Upload rendered book for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quarto-book-html
          path: _book/
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
