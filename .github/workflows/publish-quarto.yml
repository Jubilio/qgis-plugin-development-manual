name: Publish Quarto book

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "_quarto.yml"
      - "index.qmd"
      - "styles.css"
      - "manual/**"
      - "assets/**"
      - "scripts/prepare_quarto.py"
      - ".github/workflows/publish-quarto.yml"
  push:
    branches: [main]
    paths:
      - "_quarto.yml"
      - "index.qmd"
      - "styles.css"
      - "manual/**"
      - "assets/**"
      - "scripts/prepare_quarto.py"
      - ".github/workflows/publish-quarto.yml"

permissions:
  contents: write

jobs:
  render-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Generate Quarto chapters
        run: python scripts/prepare_quarto.py

      - name: Render HTML book
        run: quarto render --to html

      - name: Validate rendered book
        shell: bash
        run: |
          set -euo pipefail
          test -s _book/index.html
          test -s _book/search.json
          grep -q 'Jubílio Filiano Maússe' _book/index.html
          if grep -R 'Jubílio Filiano Mausse' _book --include='*.html'; then
            echo "The rendered book contains the unaccented family name"
            exit 1
          fi

      - name: Publish to GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
